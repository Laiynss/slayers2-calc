# Publie le dossier site/ sur GitHub Pages à chaque push sur main.
#
# Seul site/ part en ligne : data/ et tools/ restent dans le dépôt comme
# sources, mais ne sont pas servis.
#
# À faire une fois sur GitHub : Settings > Pages > Source = GitHub Actions.

name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch: # permet de relancer le déploiement à la main

permissions:
  contents: read
  pages: write
  id-token: write

# Un seul déploiement à la fois, sans annuler celui en cours.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
